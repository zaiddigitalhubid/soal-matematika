<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soal Nilai Tambah — Matematika</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --dark: #111111;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --gold: #f5c842;
    --gold-dim: #c9a22e;
    --white: #f0f0f0;
    --grey: #888;
    --correct: #4ade80;
    --wrong: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 32px;
    padding-top: 16px;
  }

  .badge {
    display: inline-block;
    background: var(--gold);
    color: var(--black);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 16px;
  }

  .header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .header h1 span { color: var(--gold); }

  .header p {
    color: var(--grey);
    font-size: 13px;
  }

  /* PROGRESS */
  .progress-wrap {
    max-width: 520px;
    margin: 0 auto 28px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--grey);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 4px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* IDENTITY FORM */
  #identity-section {
    max-width: 480px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--grey);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .form-group input {
    width: 100%;
    background: var(--black);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--white);
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    border-color: var(--gold);
  }

  .form-group input::placeholder { color: #444; }

  /* BUTTONS */
  .btn-primary {
    width: 100%;
    background: var(--gold);
    color: var(--black);
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    letter-spacing: 0.3px;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* QUIZ SECTION */
  #quiz-section { display: none; max-width: 520px; margin: 0 auto; }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 16px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 22px;
    color: var(--white);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--black);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    color: var(--white);
    text-align: left;
    transition: border-color 0.2s, background 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .option:hover:not(:disabled) {
    border-color: var(--gold);
    background: #1f1a00;
  }

  .option-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    min-width: 26px;
    background: var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    color: var(--grey);
    transition: background 0.2s, color 0.2s;
  }

  .option.selected {
    border-color: var(--gold);
    background: #1f1a00;
  }

  .option.selected .option-label {
    background: var(--gold);
    color: var(--black);
  }

  .option.correct {
    border-color: var(--correct);
    background: #052010;
  }

  .option.correct .option-label {
    background: var(--correct);
    color: var(--black);
  }

  .option.wrong {
    border-color: var(--wrong);
    background: #200505;
  }

  .option.wrong .option-label {
    background: var(--wrong);
    color: var(--black);
  }

  .option:disabled { cursor: default; }

  /* NAV */
  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }

  .btn-nav {
    flex: 1;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--grey);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .btn-nav:hover:not(:disabled) {
    border-color: var(--white);
    color: var(--white);
  }

  .btn-nav:disabled { opacity: 0.3; cursor: default; }

  .btn-next {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--black);
    font-weight: 800;
  }

  .btn-next:hover:not(:disabled) {
    opacity: 0.9;
    color: var(--black);
    border-color: var(--gold);
  }

  /* RESULT SECTION */
  #result-section {
    display: none;
    max-width: 520px;
    margin: 0 auto;
    text-align: center;
  }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 4px solid var(--gold);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    background: #1a1500;
  }

  .score-number {
    font-size: 40px;
    font-weight: 800;
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
  }

  .score-label {
    font-size: 11px;
    color: var(--grey);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .result-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .result-sub {
    color: var(--grey);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .stat-num {
    font-size: 24px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
  }

  .stat-desc {
    font-size: 12px;
    color: var(--grey);
    margin-top: 4px;
  }

  .status-msg {
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .status-msg.excellent { background: #052010; border: 1px solid var(--correct); color: var(--correct); }
  .status-msg.good { background: #1a1500; border: 1px solid var(--gold); color: var(--gold); }
  .status-msg.keep-going { background: #200505; border: 1px solid var(--wrong); color: var(--wrong); }

  .submit-info {
    font-size: 12px;
    color: var(--grey);
    margin-top: 12px;
  }

  /* DOTS NAV */
  .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.2s, transform 0.2s;
  }

  .dot.answered { background: var(--gold-dim); }
  .dot.current { background: var(--gold); transform: scale(1.4); }

  /* LOADING */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }

  .loading-overlay.show { display: flex; }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { font-size: 14px; color: var(--grey); }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Menyimpan nilai kamu...</div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="badge">Nilai Tambah</div>
  <h1>Soal <span>Matematika</span><br>Kelas X</h1>
  <p>10 soal pilihan ganda · Kerjakan dengan jujur</p>
</div>

<!-- IDENTITY -->
<div id="identity-section">
  <div class="card">
    <div class="card-title">Data Diri</div>
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="inputNama" placeholder="Tulis nama lengkap kamu">
    </div>
    <div class="form-group">
      <label>Kelas</label>
      <input type="text" id="inputKelas" placeholder="Contoh: X-1, X-2, X MIPA 1...">
    </div>
  </div>
  <button class="btn-primary" onclick="startQuiz()">Mulai Mengerjakan →</button>
</div>

<!-- QUIZ -->
<div id="quiz-section">
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="progressText">Soal 1 dari 10</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="dots" id="dotsNav"></div>

  <div id="questionContainer"></div>

  <div class="nav-row">
    <button class="btn-nav" id="btnPrev" onclick="prevQuestion()" disabled>← Sebelumnya</button>
    <button class="btn-nav btn-next" id="btnNext" onclick="nextQuestion()" disabled>Selanjutnya →</button>
  </div>
</div>

<!-- RESULT -->
<div id="result-section">
  <div class="card">
    <div class="score-circle">
      <div class="score-number" id="scoreNum">0</div>
      <div class="score-label">SKOR</div>
    </div>
    <div class="result-title" id="resultTitle">Selesai!</div>
    <div class="result-sub" id="resultSub"></div>

    <div class="result-stats">
      <div class="stat-box">
        <div class="stat-num" id="statBenar">0</div>
        <div class="stat-desc">Jawaban Benar</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statSalah">0</div>
        <div class="stat-desc">Jawaban Salah</div>
      </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <button class="btn-primary" id="btnSubmit" onclick="submitResult()">
      ✓ Kirim Nilai Saya
    </button>
    <div class="submit-info">Nilai akan otomatis tersimpan setelah dikirim</div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQr_UhzY9m3eYhkO3DcW9HygQl4EYQ3fWqugj_ok2iaVsRdkiInpQKBQb-rm3K755Z/exec';

const questions = [
  {
    q: "Sebuah dadu dilempar sekali. Peluang muncul bilangan genap adalah...",
    opts: ["1/6", "1/3", "1/2", "2/3"],
    ans: 2
  },
  {
    q: "Sebuah koin dilempar 3 kali. Banyaknya anggota ruang sampel adalah...",
    opts: ["3", "6", "8", "9"],
    ans: 2
  },
  {
    q: "Dari seperangkat kartu bridge (52 kartu), peluang terambilnya kartu As adalah...",
    opts: ["1/52", "1/26", "1/13", "4/13"],
    ans: 2
  },
  {
    q: "Dua buah dadu dilempar bersamaan. Peluang jumlah kedua dadu adalah 7 adalah...",
    opts: ["1/6", "5/36", "7/36", "1/4"],
    ans: 0
  },
  {
    q: "Peluang suatu kejadian A adalah 0,35. Peluang komplemen kejadian A adalah...",
    opts: ["0,35", "0,55", "0,65", "0,75"],
    ans: 2
  },
  {
    q: "Dalam sebuah kotak terdapat 4 bola merah dan 6 bola putih. Peluang terambilnya bola merah adalah...",
    opts: ["2/5", "3/5", "1/4", "1/3"],
    ans: 0
  },
  {
    q: "Kejadian A dan B saling lepas. P(A) = 0,3 dan P(B) = 0,4. Maka P(A∪B) adalah...",
    opts: ["0,12", "0,3", "0,4", "0,7"],
    ans: 3
  },
  {
    q: "Sebuah dadu dilempar sekali. Peluang muncul bilangan prima adalah...",
    opts: ["1/6", "1/3", "1/2", "2/3"],
    ans: 2
  },
  {
    q: "Dari 5 siswa putra dan 3 siswa putri akan dipilih 1 orang sebagai ketua kelas. Peluang terpilihnya siswa putri adalah...",
    opts: ["1/8", "3/8", "5/8", "3/5"],
    ans: 1
  },
  {
    q: "Jika P(A) = 1/3, P(B) = 1/4, dan kejadian A dan B saling bebas, maka P(A∩B) adalah...",
    opts: ["1/12", "1/7", "7/12", "5/12"],
    ans: 0
  }
];

let current = 0;
let answers = new Array(questions.length).fill(null);
let nama = '', kelas = '';
const labels = ['A', 'B', 'C', 'D'];

function startQuiz() {
  nama = document.getElementById('inputNama').value.trim();
  kelas = document.getElementById('inputKelas').value.trim();
  if (!nama || !kelas) { alert('Isi nama dan kelas dulu ya!'); return; }
  document.getElementById('identity-section').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  buildDots();
  renderQuestion();
}

function buildDots() {
  const dots = document.getElementById('dotsNav');
  dots.innerHTML = questions.map((_, i) =>
    `<div class="dot" id="dot${i}"></div>`
  ).join('');
}

function updateDots() {
  questions.forEach((_, i) => {
    const d = document.getElementById(`dot${i}`);
    d.className = 'dot' + (i === current ? ' current' : answers[i] !== null ? ' answered' : '');
  });
}

function renderQuestion() {
  const q = questions[current];
  const answered = answers[current];
  const pct = Math.round((current / questions.length) * 100);

  document.getElementById('progressText').textContent = `Soal ${current + 1} dari ${questions.length}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  updateDots();

  const isLast = current === questions.length - 1;
  const allDone = answers.every(a => a !== null);

  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = answered === null;
  document.getElementById('btnNext').textContent = isLast
    ? (allDone ? 'Lihat Hasil →' : 'Selanjutnya →')
    : 'Selanjutnya →';

  document.getElementById('questionContainer').innerHTML = `
    <div class="question-card">
      <div class="question-num">SOAL ${String(current + 1).padStart(2, '0')} / 10</div>
      <div class="question-text">${q.q}</div>
      <div class="options">
        ${q.opts.map((opt, i) => {
          let cls = 'option';
          if (answered !== null) {
            if (i === q.ans) cls += ' correct';
            else if (i === answered && i !== q.ans) cls += ' wrong';
          } else if (i === answered) cls += ' selected';
          return `<button class="${cls}" onclick="selectAnswer(${i})" ${answered !== null ? 'disabled' : ''}>
            <span class="option-label">${labels[i]}</span>${opt}
          </button>`;
        }).join('')}
      </div>
    </div>
  `;
}

function selectAnswer(idx) {
  if (answers[current] !== null) return;
  answers[current] = idx;
  const allDone = answers.every(a => a !== null);
  document.getElementById('btnNext').disabled = false;
  if (current === questions.length - 1 && allDone) {
    document.getElementById('btnNext').textContent = 'Lihat Hasil →';
  }
  renderQuestion();
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (current > 0) { current--; renderQuestion(); }
}

function showResult() {
  const benar = answers.filter((a, i) => a === questions[i].ans).length;
  const skor = Math.round((benar / questions.length) * 100);

  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';

  document.getElementById('scoreNum').textContent = skor;
  document.getElementById('statBenar').textContent = benar;
  document.getElementById('statSalah').textContent = questions.length - benar;

  let title, sub, msgClass, msg;
  if (skor >= 80) {
    title = 'Luar Biasa! 🎉'; sub = 'Kamu memahami materi dengan sangat baik.';
    msgClass = 'excellent'; msg = '✓ Nilai kamu sangat memuaskan!';
  } else if (skor >= 60) {
    title = 'Bagus! 👍'; sub = 'Terus tingkatkan pemahamanmu.';
    msgClass = 'good'; msg = '✓ Nilai kamu sudah cukup baik.';
  } else {
    title = 'Semangat! 💪'; sub = 'Pelajari lagi materinya ya.';
    msgClass = 'keep-going'; msg = '⚠ Kamu perlu belajar lebih giat lagi.';
  }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;
  document.getElementById('statusMsg').className = `status-msg ${msgClass}`;
  document.getElementById('statusMsg').textContent = msg;
}

async function submitResult() {
  const benar = answers.filter((a, i) => a === questions[i].ans).length;
  const skor = Math.round((benar / questions.length) * 100);

  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('btnSubmit').disabled = true;

  const payload = { nama, kelas, skor, benar, total: questions.length };

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    document.getElementById('loadingOverlay').classList.remove('show');
    document.getElementById('btnSubmit').textContent = '✓ Nilai Berhasil Dikirim!';
    document.getElementById('btnSubmit').style.background = '#4ade80';
    document.getElementById('btnSubmit').disabled = true;
    document.querySelector('.submit-info').textContent = `Nilai ${nama} sudah tersimpan. Terima kasih!`;
  } catch(e) {
    document.getElementById('loadingOverlay').classList.remove('show');
    document.getElementById('btnSubmit').disabled = false;
    alert('Gagal mengirim, coba lagi ya.');
  }
}
</script>
</body>
</html>
